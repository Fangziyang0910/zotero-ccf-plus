name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check release version
        run: node -e 'if ("v" + require("./package.json").version !== process.env.GITHUB_REF_NAME) process.exit(1)'
      - run: npm run check
      - run: npm run build
      - name: Publish package and update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" build/zotero-ccf-plus.xpi --title "$GITHUB_REF_NAME" --generate-notes --prerelease --latest=false
          else
            gh release create "$GITHUB_REF_NAME" build/zotero-ccf-plus.xpi --title "$GITHUB_REF_NAME" --generate-notes
          fi
          if ! gh release view release >/dev/null 2>&1; then
            gh release create release --title "Plugin update feed" --notes "Update metadata for Zotero's plugin updater." --latest=false
          fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release upload release build/update-beta.json --clobber
          else
            gh release upload release build/update.json build/update-beta.json --clobber
          fi
